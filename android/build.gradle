plugins {
    id("com.android.library")
    id("kotlin-android")
}

android {
    compileSdkVersion 34
    
    // Add namespace configuration (required for newer Android Gradle Plugin versions)
    namespace 'expo.modules.paysafe'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    flatDir {
        dirs 'lib/cardpaymentaar', 'lib/paysafecoreaar', 'lib/tokenizationaar', 'lib/threedsecureaar', 'lib/paysafecardinalaar'
    }
}

dependencies {
    // React Native and basic Android dependencies
    implementation "com.facebook.react:react-native:+"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation "androidx.annotation:annotation:1.6.0"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // Kotlin serialization (required by Paysafe SDK)
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0"
    
    // OkHttp dependencies (required by Paysafe SDK)
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    
    // Compose dependencies (required by Paysafe SDK)
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    
    // Paysafe SDK AAR dependencies
    implementation(name: 'card-payments-release', ext: 'aar')
    implementation(name: 'paysafe-core-release', ext: 'aar')
    implementation(name: 'tokenization-release', ext: 'aar')
    implementation(name: 'threedsecure-release', ext: 'aar')
    implementation(name: 'paysafe-cardinal', ext: 'aar')
    
    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
} 